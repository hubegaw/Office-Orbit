global:
  scrape_interval: 15s

  evaluation_interval: 15s

  external_labels:
    environment: 'local'
    cluster: 'office-orbit-dev'

# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#           - alertmanager:9093

# rule_files:
#   - "alerts/*.yml"

scrape_configs:

  - job_name: 'prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'
          tier: 'monitoring'

  - job_name: 'postgres-exporter'
    scrape_interval: 15s
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'postgresql'
          tier: 'database'

  - job_name: 'quarkus-backend'
    scrape_interval: 10s
    metrics_path: '/q/metrics'
    static_configs:
      - targets: ['backend:8080']
        labels:
          service: 'office-orbit-backend'
          tier: 'application'

